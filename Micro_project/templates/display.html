<!DOCTYPE html>

<html>

<head>

    <title>Display Students</title>

    <style>

        body{
            background-color: #FAF7F0;
            font-family: Arial;
        }

        .container{
            width: 70%;
            margin: auto;
            margin-top: 50px;
            background-color: #F5E6CA;
            padding: 30px;
            border-radius: 10px;
        }

        h1{
            text-align: center;
            color: #008080;
        }

        .student-box{
            background-color: white;
            padding: 15px;
            margin-top: 15px;
            border-left: 5px solid #008080;
            border-radius: 5px;
        }

        p{
            font-size: 17px;
            line-height: 1.6;
        }

        .no-data{
            text-align: center;
            color: red;
            font-weight: bold;
        }

        button{
            background-color: #008080;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #006666;
        }

        .btn-box{
            text-align: center;
        }

        a{
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Records</h1>

        {% if students|length == 0 %}

            <p class="no-data">
                No Student Records Found
            </p>

        {% endif %}

        {% for i in students %}

            <div class="student-box">

                <p>
                    <strong>Roll No:</strong>
                    {{ i.Roll_no }}

                    <br>

                    <strong>Name:</strong>
                    {{ i.name }}

                    <br>

                    <strong>Marks:</strong>
                    {{ i.marks }}
                </p>

            </div>

        {% endfor %}

        <div class="btn-box">

            <a href="/">
                <button>
                    Back to Home
                </button>
            </a>

        </div>

    </div>

</body>

</html>
